# fakesvc main config
listen 127.0.0.1:8025
data_dir /var/lib/fakesvc/store
archive_dir /opt/fakesvc-archive
tls_cert_file /etc/pki/tls/certs/fakesvc.crt
tls_key_file /etc/pki/tls/private/fakesvc.key
db_password = hunter2-SUPERSECRET
upstream smtp://relayuser:relaypass@mail.example.net:587
backend unix:/run/spamd/spamd.sock?auth=sockq-SENTINEL
# old_password = commented-out-secret
ca_url = https://admin:pkipass-SENTINEL@pki.example/ca.pem
proxy http://svc:pa/ss+w0rd-SENTINEL@backend.example:8080/api
webhook https://hooks.example.net/services/T000/hooktoken-SENTINEL
dsn postgres://u:dsnpw@db.example/app?password=LEAK3
